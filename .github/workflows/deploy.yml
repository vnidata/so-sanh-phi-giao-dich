name: Deploy & Scheduled Fee Sync to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  schedule:
    # Tự động quét cập nhật biểu phí định kỳ vào lúc 01:00 UTC (08:00 sáng Thứ Hai VN) hàng tuần
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated broker scanner & audit update
        run: npm run scan

      - name: Run automated test suite
        run: npm test

      - name: Commit and push updated audit reports if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scan-report.json securities-manual-audit.json src/data/manualOverrides.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-update): tự động cập nhật dữ liệu quét biểu phí định kỳ [skip ci]"
            git push
          else
            echo "No data changes detected."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production bundle
        run: npm run build

      - name: Create 404.html for GitHub Pages SPA routing
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
